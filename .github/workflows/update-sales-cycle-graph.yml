name: Update sales cycle graph

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/update-sales-cycle-graph.yml'

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip-cycle-graph]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace sales cycle dashboard
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/DashboardRedesign.jsx')
          text = path.read_text()
          start = text.index('function SalesCycleAnalysis({ clients, contactLogs }) {')
          end_marker = '\n}\n\n// ════════════════════════════════════════════════════════════════════════════════════════\n// SECTION: PIPELINE AGE'
          end = text.index(end_marker, start) + 2

          replacement = r'''function SalesCycleAnalysis({ clients, contactLogs }) {
  const cycleData = clients
    .filter(c => c.stage === 'active' && c.won_at)
    .map(c => {
      const clientLogs = contactLogs.filter(l => l.client_id === c.id && l.contacted_at)
      if (clientLogs.length === 0) return null

      const firstContact = clientLogs.reduce((min, l) =>
        new Date(l.contacted_at) < new Date(min.contacted_at) ? l : min
      )

      const daysToClose = Math.max(0, Math.round(
        (new Date(c.won_at) - new Date(firstContact.contacted_at)) / 86400000
      ))

      return {
        date: c.won_at,
        label: new Date(c.won_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
        fullDate: new Date(c.won_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),
        days: daysToClose,
        client: c.name || c.company_name || 'Deal',
      }
    })
    .filter(Boolean)
    .sort((a, b) => new Date(a.date) - new Date(b.date))

  if (cycleData.length === 0) {
    return (
      <div className="dash-card">
        <div className="dash-card-title">Sales Cycle — First Contact to Close</div>
        <div style={{ padding: '40px 0', textAlign: 'center', color: 'var(--text-muted)' }}>
          No won deals yet to analyze
        </div>
      </div>
    )
  }

  const cycles = cycleData.map(d => d.days)
  const avgCycle = Math.round(cycles.reduce((a, b) => a + b, 0) / cycles.length)
  const medianSorted = [...cycles].sort((a, b) => a - b)
  const medianCycle = medianSorted[Math.floor(medianSorted.length / 2)]
  const latestCycle = cycleData[cycleData.length - 1].days
  const previousCycle = cycleData.length > 1 ? cycleData[cycleData.length - 2].days : null
  const trend = previousCycle !== null ? latestCycle - previousCycle : 0

  return (
    <div className="dash-card">
      <div className="dash-card-title">Sales Cycle — First Contact to Close</div>
      <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 12 }}>
        Days from first contact to winning each deal — lower and falling means the sales engine is getting faster.
      </div>

      <ResponsiveContainer width="100%" height={220}>
        <LineChart data={cycleData} margin={{ top: 12, right: 8, left: -24, bottom: 0 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(0,0,0,0.05)" />
          <XAxis
            dataKey="label"
            tick={{ fontSize: 10, fill: 'var(--text-muted)' }}
            interval="preserveStartEnd"
          />
          <YAxis
            tick={{ fontSize: 10, fill: 'var(--text-muted)' }}
            allowDecimals={false}
            label={{ value: 'Days', angle: -90, position: 'insideLeft', fontSize: 10, fill: 'var(--text-muted)' }}
          />
          <Tooltip
            contentStyle={{ fontSize: 12, borderRadius: 8, border: '1px solid var(--border-light)' }}
            formatter={(value) => [`${value} days`, 'Sales cycle']}
            labelFormatter={(label, payload) => payload?.[0]?.payload?.fullDate || label}
          />
          <Line
            type="monotone"
            dataKey="days"
            stroke="var(--primary)"
            strokeWidth={2.5}
            dot={{ r: 4, fill: 'var(--primary)' }}
            activeDot={{ r: 6 }}
          />
        </LineChart>
      </ResponsiveContainer>

      <div style={{ display: 'flex', gap: 20, marginTop: 12, flexWrap: 'wrap' }}>
        <div style={{ textAlign: 'left' }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--primary)' }}>{avgCycle}d</div>
          <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>average</div>
        </div>
        <div style={{ textAlign: 'left' }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--text-dark)' }}>{medianCycle}d</div>
          <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>median</div>
        </div>
        <div style={{ textAlign: 'left' }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: trend < 0 ? 'var(--success)' : trend > 0 ? 'var(--error)' : 'var(--text-dark)' }}>
            {previousCycle === null ? '—' : `${trend > 0 ? '+' : ''}${trend}d`}
          </div>
          <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>vs previous deal</div>
        </div>
        <div style={{ textAlign: 'left' }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--text-dark)' }}>{cycleData.length}</div>
          <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>deals analyzed</div>
        </div>
      </div>
    </div>
  )
}'''

          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit dashboard change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DashboardRedesign.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Replace sales cycle metrics with trend graph [skip-cycle-graph]'
          git push
